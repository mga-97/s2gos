[project]
name = "s2gos-monorepo"
version = "0.1.0"
description = "Development workspace for the S2GOS generator and simulator."
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" }
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.12"
jupyterlab = ">=4,<5"
pytest = ">=8"
ruff = ">=0.2"
mkdocs = ">=1.5"
fsspec = ">=2023.1.0"

[tool.pixi.pypi-dependencies]
s2gos_utils = { path = "./packages/s2gos-utils", editable = true }
s2gos_generator = { path = "./packages/s2gos-generator", editable = true }
s2gos_simulator = { path = "./packages/s2gos-simulator", editable = true }

[tool.pixi.tasks]
lab = "jupyter lab"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
docs = "mkdocs serve"
integration = "python integration_example_eradiate.py"
simple = "python simple_integration_example.py"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.dependencies]
ipython = "*"
ipykernel = "*"