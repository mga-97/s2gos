[project]
name = "s2gos-apps"
version = "0.0.1"
description = "Development workspace for the S2GOS generator and simulator."
authors = [
  { name = "Misael Gonzalez (Rayference)" },
  { name = "Nicolae Marton (Rayference)" },
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.12"
jupyterlab = ">=4,<5"
pytest = ">=8"
ruff = ">=0.2"
mkdocs = ">=1.5"
snakeviz = ">=2.2.2,<3"
# procodile = ">=0.0.8,<0.0.9"
s3fs = ">=2025.12.0,<2026"
mkdocs-monorepo-plugin = ">=1.1.2,<2"
mkdocs-material = ">=9.7.1,<10"

[tool.pixi.pypi-dependencies]
# S2GOS_CONTROLLER/EOZILLA DEPS ------------------------------------------------
# Combined sub-workspace dependencies to prevent our editable
# PyPI dependencies (our project's sub-workspaces) to install
# PyPI packages instead of using conda packages.
click = "*"
fastapi = "*"
httpx = "*"
pydantic = "*"
pydantic-settings = "*"
pyyaml = "*"
typer = "*"
uri-template = "*"
uvicorn = "*"
# IDE integration
# pixi-pycharm = ">=0.0.8,<0.0.9"
# GUI testing
ipyleaflet = "*"
ipywidgets = "*"
ipywidgets_bokeh = "*"
jupyter = "*"
notebook = "*"
panel = "==1.8.3"
param = "==2.3.1"
watchfiles = "*"
# # Use cases testing
dask = "<2025"
xarray = ">=2023.1.0,<2025"
zarr = "<3"
# # Needed in /tools
datamodel-code-generator = "*"
tomlkit = "*"  # to sync versions
# ------------------------------------------------------------------------------
s2gos_utils = { path = "./packages/s2gos-utils", editable = true }
s2gos_generator = { path = "./packages/s2gos-generator", editable = true }
s2gos_simulator = { path = "./packages/s2gos-simulator", editable = true }
s2gos_apps = { path = ".", editable = true }
# I wished we could have "no-deps=true" here,
# or even better "[tool.pixi.workspaces]".
# See https://github.com/prefix-dev/pixi/issues/1417.
s2gos-client = { path = "../s2gos-controller/s2gos-client", editable = true }
s2gos-server = { path = "../s2gos-controller/s2gos-server", editable = true }
#
# Uncomment the following to allow using eozilla from sources
# Note, using the wraptile server is for testing only
#
appligator = { path = "../eozilla/appligator", editable = true }
cuiman = { path = "../eozilla/cuiman", editable = true }
gavicore = { path = "../eozilla/gavicore", editable = true }
procodile = { path = "../eozilla/procodile", editable = true }
wraptile = { path = "../eozilla/wraptile", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
memory-profiler = ">=0.61.0,<0.62"
memray = ">=1.18.0,<2"

[tool.pixi.tasks]
eradiate-init = "eradiate data install core gecko"
apps-init = { depends-on = ["eradiate-init"] }
lab = "jupyter lab"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
docs = "mkdocs serve"
integration = "python integration_example_eradiate.py"
simple = "python simple_integration_example.py"

[tool.pixi.feature.dev.dependencies]
ipython = "*"
ipykernel = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[project.scripts]
s2gos_apps = "s2gos_apps.cli:cli"

[tool.pytest.ini_options]
testpaths = [
    "packages/s2gos-utils",
    "packages/s2gos-generator",
    "packages/s2gos-simulator",
]